<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1040" viewBox="0 0 780 1040" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#5b6b6b"/>
    </marker>
  </defs>
  <rect width="780" height="1040" fill="#faf7f0"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1f2937">The gate flow — Ramesh, 82 days → 96 days</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">One worker, one agent, three gates: the 90-day certificate, the claim order, the renewal clock.</text>

  <g>
    <rect x="40" y="96" width="700" height="78" rx="10" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="64" y="126" font-size="13" font-weight="700" fill="#0f4c4c">1 · STORY</text>
    <text x="64" y="150" font-size="15" fill="#1f2937">Ramesh, 41, mason, Nagpur — “I worked 82 days last year.”</text>
    <text x="64" y="168" font-size="13" fill="#6b7280">Nobody told him he needs 90 days for MahaBOCW registration.</text>
  </g>
  <line x1="390" y1="174" x2="390" y2="196" stroke="#5b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="196" width="700" height="78" rx="10" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="64" y="226" font-size="13" font-weight="700" fill="#0f4c4c">2 · STRUCTURED PROFILE</text>
    <text x="64" y="250" font-size="15" fill="#1f2937">Work, days, age, family, bank account — confirmed back to the worker.</text>
    <text x="64" y="268" font-size="13" fill="#6b7280">“This is what I understood — is it right?” Nothing free-text is trusted for a verdict.</text>
  </g>
  <line x1="390" y1="274" x2="390" y2="296" stroke="#5b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="296" width="700" height="78" rx="10" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="64" y="326" font-size="13" font-weight="700" fill="#0f4c4c">3 · TWELVE RULES RUN AS DATA</text>
    <text x="64" y="350" font-size="15" fill="#1f2937">Each scheme returns ✓ likely eligible, ✗ not eligible, or ? check — with its reason.</text>
    <text x="64" y="368" font-size="13" fill="#6b7280">Rules live in schemes.json, not in hard-coded if/else. Order: e-Shram → insurance → BOCW.</text>
  </g>
  <line x1="390" y1="374" x2="390" y2="396" stroke="#5b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="396" width="700" height="78" rx="10" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="64" y="426" font-size="13" font-weight="700" fill="#0f4c4c">4 · CERTIFICATE PHOTO</text>
    <text x="64" y="450" font-size="15" fill="#1f2937">His new certificate shows 96 days of work in the last 12 months.</text>
    <text x="64" y="468" font-size="13" fill="#6b7280">Sample certificate in the demo. A worker can upload their own photo instead.</text>
  </g>
  <line x1="390" y1="474" x2="390" y2="496" stroke="#5b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="496" width="700" height="78" rx="10" fill="#fff7e6" stroke="#d9a441" stroke-width="1.5"/>
    <text x="64" y="526" font-size="13" font-weight="700" fill="#92400e">5 · EXTRACTION — THE CROP IS THE PROOF</text>
    <text x="64" y="550" font-size="15" fill="#1f2937">Days, employer, dates — each value shown next to the crop it was read from.</text>
    <text x="64" y="568" font-size="13" fill="#6b7280">Never a bare “verified ✓”. If a value has no crop, it is “?”, not ✓.</text>
  </g>
  <line x1="390" y1="574" x2="390" y2="596" stroke="#5b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="596" width="700" height="78" rx="10" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="64" y="626" font-size="13" font-weight="700" fill="#0f4c4c">6 · CONFIRM — NOTHING COUNTS UNTIL THE WORKER SAYS SO</text>
    <text x="64" y="650" font-size="15" fill="#1f2937">“Is this right?” — Confirm or Edit for every extracted value.</text>
    <text x="64" y="668" font-size="13" fill="#6b7280">The gate verdict is computed from confirmed values only.</text>
  </g>
  <line x1="390" y1="674" x2="390" y2="696" stroke="#5b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="696" width="340" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="64" y="726" font-size="13" font-weight="700" fill="#b91c1c">7a · BEFORE — 82 DAYS</text>
    <text x="64" y="752" font-size="16" font-weight="700" fill="#7f1d1d">Only 8 days short.</text>
    <text x="64" y="774" font-size="13" fill="#6b7280">Work 8 more days, get the</text>
    <text x="64" y="790" font-size="13" fill="#6b7280">certificate from your contractor.</text>
  </g>
  <g>
    <rect x="400" y="696" width="340" height="96" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="424" y="726" font-size="13" font-weight="700" fill="#15803d">7b · AFTER — 96 DAYS</text>
    <text x="424" y="752" font-size="16" font-weight="700" fill="#14532d">Gate open! You are eligible.</text>
    <text x="424" y="774" font-size="13" fill="#6b7280">90 days complete — MahaBOCW</text>
    <text x="424" y="790" font-size="13" fill="#6b7280">registration can now be claimed.</text>
  </g>
  <line x1="390" y1="792" x2="390" y2="814" stroke="#5b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="814" width="700" height="78" rx="10" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="64" y="844" font-size="13" font-weight="700" fill="#0f4c4c">8 · MONEY UNLOCKED — VERIFIED AMOUNTS ONLY</text>
    <text x="64" y="868" font-size="15" fill="#1f2937">₹5,000 tool-kit aid, claimable after registration at mahabocw.in.</text>
    <text x="64" y="886" font-size="13" fill="#6b7280">Scholarship eligibility unlocked — in words, no ₹ figure (amount unverified).</text>
  </g>
  <line x1="390" y1="892" x2="390" y2="914" stroke="#5b6b6b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="914" width="700" height="78" rx="10" fill="#ffffff" stroke="#e5e0d5" stroke-width="1.5"/>
    <text x="64" y="944" font-size="13" font-weight="700" fill="#0f4c4c">9 · PACK, RENEWAL, TRACKING</text>
    <text x="64" y="968" font-size="15" fill="#1f2937">5-document quest, printable pack, renewal countdown, manual tracker.</text>
    <text x="64" y="986" font-size="13" fill="#6b7280">Tracker statuses are updated by hand — the app never fakes a live portal status.</text>
  </g>
</svg>
